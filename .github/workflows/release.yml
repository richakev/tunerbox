# Builds TunerBox for Windows, macOS and Linux, publishes a GitHub Release and the Docker image.
#   * Push a tag like v1.4.1  -> builds all three with that version and publishes release v1.4.1.
#   * Push to main            -> the same, as the next patch version (newest release tag + 1, e.g. 1.6.0 -> 1.6.1,
#                                or the version in tunerbox/__init__.py if that is higher); the tag is created for you.
#   * Push to testing         -> builds all three as downloadable artifacts (no release, no Docker image);
#                                the file names say the branch and commit, e.g. TunerBox-1.7.2-testing-5f0b230-windows-portable.zip.
#   * Actions tab > "Build & release" > Run workflow -> a test build like testing, for any branch.
# Afterwards the builds list (packaging/builds_page.py) is written to the run summary, kept as an artifact,
# and, with the BUILDS_GIST_ID variable and BUILDS_GIST_TOKEN secret (a token with only the "gist"
# scope), written to that gist. Nothing else needs secrets. See RELEASING.md.
name: Build & release

on:
  push:
    tags: ["v*.*.*"]
    branches: ["main", "testing"]
  workflow_dispatch:

permissions:
  contents: read

# one release at a time per branch/tag, so two quick pushes to main can't pick the same version
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ version: decided once, used by every job
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}   # e.g. 1.6.1
      tag: ${{ steps.v.outputs.tag }}           # e.g. v1.6.1 (release builds only)
      label: ${{ steps.v.outputs.label }}       # e.g. -testing-5f0b230 (branch builds only)
      release: ${{ steps.v.outputs.release }}   # "true" when this run publishes a release + Docker image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: v
        shell: bash
        run: |
          git fetch --quiet --depth=1 origin "+refs/tags/*:refs/tags/*"
          # newest numeric release tag, with or without "v"; "1.6" counts as 1.6.0
          LATEST=$(git tag -l | sed -nE 's/^v?([0-9]+\.[0-9]+)(\.[0-9]+)?$/\1\2/p' |
            sed -E 's/^([0-9]+\.[0-9]+)$/\1.0/' | sort -Vr | sed -n '1p')
          LATEST=${LATEST:-0.0.0}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}; TAG=$GITHUB_REF_NAME; RELEASE=true; LABEL=""
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; then
            # next patch after the newest tag, unless the repo already names a higher version
            IFS=. read -r MA MI PA <<< "$LATEST"
            NEXT="$MA.$MI.$((PA + 1))"
            FILE=$(python3 packaging/set_version.py --check)
            VERSION=$(printf '%s\n%s\n' "$NEXT" "$FILE" | sort -Vr | sed -n '1p')
            while git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; do
              IFS=. read -r MA MI PA <<< "$VERSION"; VERSION="$MA.$MI.$((PA + 1))"
            done
            TAG="v$VERSION"; RELEASE=true; LABEL=""
          else
            VERSION=$LATEST; TAG=""; RELEASE=false
            LABEL="-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}"
          fi
          echo "Latest release tag: $LATEST -> version $VERSION (release: $RELEASE, tag: ${TAG:-none}, label: ${LABEL:-none})"
          { echo "version=$VERSION"; echo "tag=$TAG"; echo "label=$LABEL"; echo "release=$RELEASE"; } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ Docker image (server only) -> GitHub Packages
  # ghcr.io/<owner>/tunerbox:<version>, :<major.minor> and :latest, for 64-bit PCs and ARM (Raspberry Pi 4/5).
  # On every release. The first time, the package is private: make it public once on GitHub
  # (Your profile > Packages > tunerbox > Package settings > Change visibility).
  docker:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set version
        run: python packaging/set_version.py "${{ needs.version.outputs.version }}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR names must be lower case
          images: ghcr.io/${{ github.repository_owner }}/tunerbox
          # "value" makes the semver tags work on a push to main too, not only on a tag push
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TunerBox
            org.opencontainers.image.description=IPTV cable box: local channel numbers, guide and DVR (server only)
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ Windows: installer + portable zip
  windows:
    needs: version
    runs-on: windows-latest
    env:
      BUILD_LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set version
        run: python packaging/set_version.py "${{ needs.version.outputs.version }}"
      - name: Install Python packages
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller
      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $exe = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          & $exe -hide_banner -version | Select-Object -First 1
          "FFMPEG=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: python packaging/build.py --ffmpeg "$env:FFMPEG"
      - name: Portable zip
        shell: pwsh
        run: |
          $v = python packaging/set_version.py --check
          Compress-Archive -Path dist/TunerBox/* -DestinationPath "dist/TunerBox-$v-windows-portable.zip"
          if ($env:BUILD_LABEL) {
            Get-ChildItem dist -File | ForEach-Object { Rename-Item $_.FullName ($_.Name.Replace("-$v", "-$v$env:BUILD_LABEL")) }
          }
          Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/TunerBox-Setup-*.exe
            dist/TunerBox-*-windows-portable.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS (Apple Silicon): .app in a .dmg
  macos:
    needs: version
    runs-on: macos-15             # Apple Silicon (GitHub retires older images over time)
    env:
      BUILD_LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set version
        run: python packaging/set_version.py "${{ needs.version.outputs.version }}"
      - name: Install Python packages
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller pillow
      - name: Get a static ffmpeg
        run: |
          # static build, so the app works on Macs without Homebrew
          if curl -fsSL -o ff.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip \
             && unzip -o -q ff.zip -d ff && chmod +x ff/ffmpeg && ff/ffmpeg -hide_banner -version | head -1; then
            echo "FFARG=--ffmpeg=$PWD/ff/ffmpeg" >> "$GITHUB_ENV"
          else
            echo "::warning::Couldn't download a static ffmpeg; the Mac app will use one installed with Homebrew"
            echo "FFARG=--no-ffmpeg" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: python packaging/build.py "$FFARG"
      - name: Make the .dmg
        run: |
          V=$(python packaging/set_version.py --check)
          V="$V$BUILD_LABEL"
          hdiutil create -volname TunerBox -srcfolder dist/TunerBox.app -ov -format UDZO "dist/TunerBox-$V-macos-arm64.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/TunerBox-*-macos-arm64.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux x64: folder in a .tar.gz
  linux:
    needs: version
    runs-on: ubuntu-22.04          # older glibc = runs on more distributions
    env:
      BUILD_LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set version
        run: python packaging/set_version.py "${{ needs.version.outputs.version }}"
      - name: Install Python packages
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller
      - name: Get a static ffmpeg
        run: |
          # BtbN's builds are hosted on GitHub (reliable from Actions); johnvansickle.com as a fallback
          mkdir -p ff
          if curl -fsSL --retry 3 -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
             && tar xJf ff.tar.xz -C ff; then
            FF=$(ls -d "$PWD"/ff/ffmpeg-*/bin/ffmpeg | head -1)
          else
            echo "::warning::BtbN download failed, trying johnvansickle.com"
            curl -fsSL --retry 3 -o ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar xJf ff.tar.xz -C ff
            FF=$(ls -d "$PWD"/ff/ffmpeg-*-amd64-static/ffmpeg | head -1)
          fi
          "$FF" -hide_banner -version | head -1
          echo "FFMPEG=$FF" >> "$GITHUB_ENV"
      - name: Build
        run: python packaging/build.py --ffmpeg "$FFMPEG"
      - name: Pack
        run: |
          V=$(python packaging/set_version.py --check)
          V="$V$BUILD_LABEL"
          tar -czf "dist/TunerBox-$V-linux-x64.tar.gz" -C dist TunerBox
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/TunerBox-*-linux-x64.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------ publish (tags and main)
  release:
    needs: [version, windows, macos, linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # only the three apps: the Docker job leaves a build record artifact that can't be downloaded
          # like the others, and when it finishes first it failed the release (v1.9.0)
          pattern: "{windows,macos,linux}"
          path: out
          merge-multiple: true
      - name: List files
        run: ls -la out
      - name: Release notes for this repository's Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed "s#ghcr.io/pasiegel/#ghcr.io/$OWNER/#g" .github/release-notes.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # on a push to main this creates the tag at the pushed commit
          tag_name: ${{ needs.version.outputs.tag }}
          name: TunerBox ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
          body_path: release-notes.md
          fail_on_unmatched_files: true

  # ------------------------------------------------------------------ builds list (run summary, artifact, gist)
  builds-page:
    needs: [windows, macos, linux, release, docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Write the builds list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ vars.BUILDS_GIST_ID }}
          GIST_TOKEN: ${{ secrets.BUILDS_GIST_TOKEN }}
        run: |
          if [ -z "$GIST_ID" ] || [ -z "$GIST_TOKEN" ]; then
            echo "::warning::BUILDS_GIST_ID variable or BUILDS_GIST_TOKEN secret not set: the gist isn't updated (the list is in this run's summary). See RELEASING.md."
            unset GIST_ID GIST_TOKEN
          fi
          python packaging/builds_page.py --out builds.md
          cat builds.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: builds-page
          path: builds.md
